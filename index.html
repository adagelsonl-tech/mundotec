.card{background:var(--card);color:var(--fg);border:4px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 6px 0 var(--ink);margin-top:12px;animation:pop .35s}

.fact{margin-top:12px;padding:12px;border-radius:12px;background:#fff3bf;font-size:15px}

.av{overflow:hidden;padding:0}.av img,.ch img{width:100%;height:100%;object-fit:cover;display:block}.ch{aspect-ratio:3/4;padding:0;overflow:hidden}

var S={name:"",ch:0,done:0,score:0},cur,tm,left,sel=0;
try{var s=JSON.parse(localStorage.getItem("gm2")||"null");if(s)S=s}catch(e){}
function save(){try{localStorage.setItem("gm2",JSON.stringify(S))}catch(e){}}
var A=document.getElementById("app");
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function av(c,sm){return '<div class="av '+(sm?"s":"")+'" style="background:'+CH[c].c+'">'+(IM[c]?'<img alt="" src="'+IM[c][1]+'">':"🙂")+'</div>'}
function home(){
  var nq=P.length*6,pc=Math.round(S.done/P.length*100);
  var sh=IM.length?'<div class="show">'+[0,2,4].map(function(i){return '<img alt="" src="'+IM[i][0]+'">'}).join('')+'</div>':'';
  A.innerHTML='<div class="hero"><div class="kick">Quiz de geografia e história</div><h1>Aventura pelo Mundo</h1><p class="sub">Viaje de avião, trem e navio, conquiste destinos e aprenda a cada resposta.</p><div class="globe"><div class="orb"><span>✈️</span></div><div class="orb o2"><span>🚂</span></div><div class="orb o3"><span>🚢</span></div></div>'+sh+
  '<button class="btn" onclick="S.name?map():setup()">'+(S.name?"Continuar, "+S.name:"Jogar agora")+'</button>'+(S.name?'<div class="prog"><i style="width:'+pc+'%"></i></div><div class="sub" style="font-size:13px">'+S.done+' de '+P.length+' destinos conquistados</div>':'')+'</div>'+
  '<div class="stats"><div class="st"><b>'+P.length+'</b>destinos</div><div class="st"><b>'+nq+'</b>perguntas</div><div class="st"><b>4</b>categorias</div></div>'+
  '<h2>O que você vai aprender</h2><div class="cats"><div class="cat">🏛️<b>História</b>Civilizações, impérios e fatos marcantes</div><div class="cat">🏙️<b>Cidades</b>Monumentos e lugares famosos</div><div class="cat">📍<b>Capitais</b>Europa, Américas, Ásia e Oceania</div><div class="cat">🌐<b>Continentes</b>Oceanos, continentes e o planeta</div></div>'+
  '<h2>Como funciona</h2><div class="cats" style="grid-template-columns:1fr"><div class="cat">1️⃣<b>Crie seu avatar</b>Escolha um viajante surreal e digite seu nome</div><div class="cat">2️⃣<b>Viaje</b>Cada fase começa com uma viagem de avião, trem ou navio</div><div class="cat">3️⃣<b>Acerte 3 de 5</b>As perguntas são sorteadas. Cada resposta traz uma curiosidade</div></div>';
}
function setup(){
  sel=S.ch;
  var h='<h1>Crie seu avatar</h1><div class="sub">Escolha seu viajante surreal e parta em viagem!</div><div class="chars">';
  CH.forEach(function(c,i){h+='<button class="ch'+(i==sel?" on":"")+'" style="background:'+c.c+'" onclick="pick('+i+')">'+(IM[i]?'<img alt="" src="'+IM[i][0]+'">':"🙂")+'</button>'});
  A.innerHTML=h+'</div><input id="nm" maxlength="12" placeholder="Seu nome" value="'+S.name+'"><button class="btn" onclick="begin()">Começar aventura</button>';
}
function pick(i){sel=i;document.querySelectorAll(".ch").forEach(function(b,k){b.classList.toggle("on",k==i)})}
function begin(){S.name=(document.getElementById("nm").value.trim()||"Viajante").replace(/[<>&"]/g,"");S.ch=sel;save();map()}
function map(){
  var h='<div class="top">'+av(S.ch,1)+'<span class="pill">'+S.name+'</span><span class="pill">⭐ '+S.score+'</span><span class="pill">🛂 '+S.done+'/'+P.length+'</span></div><h1>Mapa da Viagem</h1><div class="prog"><i style="width:'+Math.round(S.done/P.length*100)+'%"></i></div>';
  P.forEach(function(p,i){
    var c=i<S.done?"done":i==S.done?"cur":"lock";
    h+='<button class="node '+c+'" onclick="go('+i+')"><span class="v">'+(i<=S.done?p.v:"🔒")+'</span><span><b>'+p.p+'</b><small>'+(i<S.done?"Conquistado ✓ · ":"")+p.t+" · "+p.n+'</small></span></button>';
  });
  if(S.done>=P.length)h+='<div class="card center"><div class="big">🏆</div><b>'+S.name+' conquistou o mundo!</b><button class="btn" onclick="reset()">Jogar de novo</button></div>';
  A.innerHTML=h+'<button class="btn alt" onclick="setup()">Trocar avatar</button><button class="btn alt" onclick="home()">‹ Página inicial</button>';
}
function reset(){S.done=0;S.score=0;save();map()}
function go(i){
  if(i>S.done)return;
  var p=P[i];
  A.innerHTML='<h1>'+p.vn+'…</h1><div class="sub">Rumo a '+p.n+'</div><div class="sky"><div class="veh">'+p.v+'</div><div class="gr"></div></div><div class="center" style="margin-top:14px">'+(IM[S.ch]?'<img alt="" src="'+IM[S.ch][0]+'" style="height:160px;animation:fl 2s ease-in-out infinite">':av(S.ch))+'</div>';
  setTimeout(function(){start(i)},2500);
}
function start(i){cur={i:i,qs:shuf(P[i].q).slice(0,5),n:0,ok:0,streak:0,gain:0};ask()}
function hud(){return '<div class="top">'+av(S.ch,1)+'<span class="pill">'+P[cur.i].e+' '+P[cur.i].p+'</span><span class="pill">✅ '+cur.ok+'/3</span><span class="pill">🔥 '+cur.streak+'</span></div>'}
function ask(){
  var it=cur.qs[cur.n];
  cur.o=shuf(it[1].map(function(t,k){return [t,k==0]}));
  left=15;
  var h=hud()+'<div class="card"><small>Pergunta '+(cur.n+1)+' de 5 · acerte 3 para avançar</small><div class="q">'+it[0]+'</div>';
  cur.o.forEach(function(o,k){h+='<button class="opt" onclick="ans('+k+')">'+o[0]+'</button>'});
  A.innerHTML=h+'<div class="bar"><i id="tb"></i></div><div id="fx"></div></div>';
  clearInterval(tm);
  tm=setInterval(function(){left-=0.1;var b=document.getElementById("tb");if(b)b.style.width=(left/15*100)+"%";if(left<=0)ans(-1)},100);
}
function ans(k){
  clearInterval(tm);
  var ok=k>=0&&cur.o[k][1];
  document.querySelectorAll(".opt").forEach(function(b,j){b.disabled=true;if(cur.o[j][1])b.classList.add("ok");else if(j==k)b.classList.add("bad")});
  if(ok){cur.ok++;cur.gain+=100+Math.ceil(Math.max(left,0)*4)+cur.streak*20;cur.streak++}else cur.streak=0;
  document.getElementById("fx").innerHTML='<div class="fact">'+(ok?"✅ Mandou bem!":k<0?"⏱️ Tempo esgotado!":"❌ Errou!")+'<br>💡 '+cur.qs[cur.n][2]+'</div><button class="btn" onclick="nxt()">Continuar</button>';
}
function nxt(){
  if(cur.n<4){cur.n++;return ask()}
  var win=cur.ok>=3;
  if(win&&cur.i==S.done){S.done++;S.score+=cur.gain;save()}
  A.innerHTML=hud()+'<div class="card center">'+(win?'<div class="big">'+P[cur.i].e+'</div><div class="stamp">'+P[cur.i].p.toUpperCase()+'<br>CONQUISTADO</div><p>Você acertou '+cur.ok+' de 5!<br>+'+cur.gain+' pontos</p><button class="btn" onclick="map()">Próxima viagem</button>':'<div class="big">💥</div><p>Você acertou '+cur.ok+' de 5. Precisa de 3 para avançar.</p><button class="btn" onclick="go('+cur.i+')">Tentar de novo</button><button class="btn alt" onclick="map()">Voltar ao mapa</button>')+'</div>';
}
snaps();home();
</script>
